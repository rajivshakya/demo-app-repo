apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: 402909940688.dkr.ecr.ap-south-1.amazonaws.com/demo-app-ecr:v1
          ports:
            - containerPort: 80